  semantic_risk_legacy_schema: schemas/artifacts/semantic-risk-report-v0.1.schema.json
  semantic_risk_legacy_schema_sha256: 6dc9198a8a522118127ac497393f857449803e6533f1ede82b03355640b75dfa
  portable_semantic_risk_legacy_schema: product/plans/schemas/semantic-risk-report-v0.1.schema.json
  semantic_risk_schema: schemas/artifacts/semantic-risk-report-v0.2.schema.json
