project: vetryn
product_name: Vetryn
profile_version: "0.3"
adoption_profile: standard
status: repo_native_execution_ready
repo_root: .
default_branch: main
source_contract: docs/oss-v1.md
maintainer_roster: MAINTAINERS.md
plan_root: product/plans/oss-v1
repository_visibility: public
standards:
  repo_contract: AGENTS.md
  product_contract: docs/oss-v1.md
  dev_guide: CONTRIBUTING.md
  architecture_guide: docs/architecture.md
  workflow_contract: WORKFLOW.md
  plan_reference: product/plans/oss-v1/plan.json
  task_adapter_contract: docs/implementation/oss-v1-execution.md
runtime_pins:
  language: typescript
  node: "22"
  package_manager: pnpm@10.23.0
  package_path: github.com/Clyra-AI/vetryn
  distribution: npm_cli_and_composite_github_action
trust_posture:
  network: offline_by_default
  credentials: no_ambient_secrets
  provider_access: explicit_task_scoped_approval
  github_review_read: advisory_for_oss_v1_single_maintainer_delivery
  bootstrap_owner_review: disabled_by_adr_0009
  github_write: explicit_listed_maintainer_authorization_and_factory_lifecycle_only
factoryd:
  status: deferred
  reason: Portable installed workers are supported; the long-running Factoryd runtime remains deferred until its TypeScript workspace lifecycle is proven.
task_adapter:
  plan_script: scripts/plan.mjs
  task_script: scripts/task.mjs
  plan_check_args:
    - check
  next_args:
    - next
  compile_args:
    - compile
  next: "pnpm --silent task:next"
  compile: "pnpm --silent task:compile -- TASK-ID"
  packet_schema: product/plans/schemas/task-packet.schema.json
skills:
  continue: .agents/skills/vetryn-continue-next/SKILL.md
  implement: .agents/skills/vetryn-implement-task/SKILL.md
  verify: .agents/skills/vetryn-verify-task/SKILL.md
  promote: .agents/skills/vetryn-promote-task/SKILL.md
  trust_review: .agents/skills/vetryn-trust-review/SKILL.md
review_policy:
  high_risk_local_review: required
  worker: code-review
  order: validation-gate_then_code-review_then_promotion_then_commit-push
  candidate_change_invalidates_validation_and_review: true
  promotion_tail: state_ledger_evidence_and_generated_progress_only
  remote_codex: separate_latest_head_residual_gate
commands:
  baseline:
    - "pnpm format:check"
    - "pnpm plan:check"
  final:
    - pnpm check
test_matrix:
  source: WORKFLOW.md#verification-and-evidence
  preservation_required: true
  tiers:
    - tier: unit
      status: active
      command_refs:
        - pnpm test
    - tier: contract
      status: active
      command_refs:
        - "pnpm test:contracts"
    - tier: acceptance
      status: active
      command_refs:
        - "pnpm plan:check"
coverage_policy:
  required: false
  command_refs:
    - "pnpm test:coverage"
    - pnpm check
  exception_policy: numeric coverage is advisory until V1-01; behavior changes require focused tests
security_scanning:
  required: true
  scanner: CodeQL
  workflow: .github/workflows/codeql.yml
ci_lanes:
  fast:
    - "pnpm format:check"
    - "pnpm plan:check"
  core:
    - pnpm check
  risk:
    - GitHub Actions CodeQL analyze (javascript-typescript)
engineering_policies:
  docs_parity: public commands, formats, policy semantics, workflow behavior, and examples update docs, schemas, fixtures, and changelog together
  provenance_evidence: task, candidate commit, reviewed input digests, actor, role, result, and redaction state remain explicit in compact evidence
implementation_risk:
  risk_tiers:
    low: local deterministic behavior with no persisted state, authority change, credential, network, remote mutation, or public contract effect
    medium: stateful or public-contract behavior with bounded local effects and no live credentialed or remote action
    high: any change matching high_risk_change_classes below
  high_risk_change_classes:
    - provider_intent
    - authentication_identity_authorization
    - billing_or_security_controls
    - persistence_or_evidence
    - model_or_command_execution
    - approval_sandbox_or_release_policy
    - data_migration_or_deletion
    - github_or_provider_status
    - credential_or_network
    - metered_spend
    - destructive_behavior
    - high_blast_radius_external_side_effect
  medium_high_required_outputs:
    - artifact_lifecycle_matrix
    - authorization_boundary_trace
    - normative_adversarial_matrix
  high_required_outputs:
    - external_effect_preflight
    - persistence_threat_matrix
  artifact_lifecycle_fields:
    - artifact
    - producer_or_authority
    - mutable_owner
    - states
    - freshness
    - integrity
    - authenticity
    - actionable_states
    - transitions_and_recovery
  authorization_boundary_stages:
    - input_validation
    - reuse_or_persistence
    - plan_authorization
    - workspace_mutation
    - command_execution
    - remote_effect
    - external_status
  external_effect_actions:
    - agent_runner
    - model
    - repository_command
    - package_registry
    - provider_sandbox
    - github
    - provider_status
  high_risk_surfaces:
    - provider_manifest_or_event
    - installation_or_authorization
    - persistence_or_evidence
    - agent_runner_or_model
    - repository_command_or_workspace_mutation
    - provider_sandbox
    - github_delivery
    - provider_status
  persistence_threats:
    - integrity
    - authenticity
    - freshness
    - completeness
    - ordering
    - anti_rollback
  review_convergence:
    implementation_design_pass: true
    exact_candidate_review_after_validation: true
    same_subsystem_p1_round_limit: 2
    standalone_p2_policy_ref: commit_push.codex_review.standalone_p2_exception
  required_transition_classes:
    - provider_authority_vs_consumer_authority
    - model_namespace_vs_effective_execution_provider
    - replay_only_vs_actionable_evidence
    - recommendation_vs_patch
    - local_branch_vs_remote_branch
    - draft_pr_vs_merge
    - optional_inputs_vs_required_inputs
  required_transition_semantics: any transition matching required_transition_classes below
architecture_policies:
  systems_thinking: medium and high risk work records state owner, feedback, blast radius, source-of-truth impact, rollback or abstention, and downstream consumers
  tdd: behavior and contract changes require failing tests or negative fixtures before implementation; skipped tests require structured evidence
  adr_triggers: public contract, identity, state, privacy, or failure semantics changes require an ADR
  reliability: persistence, filesystem mutation, provider calls, GitHub writes, and stale evidence require bounded fail-closed tests
  failure_semantics: ambiguity, stale state, privacy risk, hard-limit failure, and insufficient evidence abstain or refuse
code_review:
  review_modes:
    - diff
    - security
    - architecture
  baseline_commands:
    - "pnpm format:check"
    - "pnpm plan:check"
  command_anchors:
    - pnpm check
    - "pnpm --silent task:compile -- TASK-ID"
  high_risk_surfaces:
    - packages/core
    - packages/typescript
    - packages/cli
    - examples/openrouter-typescript
    - product/plans/schemas
    - scripts/plan.mjs
    - scripts/task.mjs
    - .github/workflows
    - docs/oss-v1.md
  severity_escalators:
    - recommendation or patch despite ambiguity, stale source, hard-limit failure, or contradictory evidence is P1
    - raw protected prompt, output, trace, or credential in durable artifacts is P1
    - evidence accepted with stale candidate, catalog, fixture, or policy binding is P1
commit_push:
  modes:
    - commit_only
    - push_pr
    - land
    - post_merge_fix
  default_remote: origin
  protected_branches:
    - main
  local_validation:
    - pnpm check
  command_anchors:
    - "pnpm plan:check"
    - pnpm check
  required_pr_checks:
    - discover-from-github
  optional_checks: []
  ci_timeout_minutes: 25
  poll_seconds: 10
  max_no_progress_cycles: 2
  merge_strategy_order:
    - squash
    - rebase
    - merge
  submodule_policy:
    factory_path: "disabled:no-factory-submodule"
    require_clean_submodules: false
    require_factory_commit_first: false
    allow_parent_pointer_update_after_factory_commit: false
  codex_review:
    enabled: true
    reviewer_identity: chatgpt-codex-connector
    initial_wait_minutes: 15
    followup_wait_minutes: 5
    eyes_wait_minutes: 15
    poll_seconds: 15
    carry_forward_requires_prior_artifact: true
    standalone_p2_exception:
      enabled: true
      authorization: explicit_human_task_or_pr
      max_findings: 1
      allowed_priorities:
        - P2
      require_current_head: true
      require_green_ci: true
      require_complete_current_head_inventory: true
      require_no_active_eyes: true
      require_no_changes_requested: true
      require_no_p0_p1: true
      require_no_unclassified: true
      forbidden_break_classes:
        - correctness
        - security
        - privacy
        - data_loss
        - contract
        - concurrency
        - evidence_integrity
        - patch_safety
        - release_integrity
      evidence_ref_required: true
  post_merge:
    monitor_main: true
    timeout_minutes: 25
    hotfix_enabled: true
    max_hotfix_loops: 2
    hotfix_branch_pattern: codex/hotfix-{topic}-r{n}
